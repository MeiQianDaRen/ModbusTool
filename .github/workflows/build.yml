name: Build ModbusTool

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Visual Studio Installer Projects
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $vsPath = & $vswhere -latest -products * -property installationPath

          if (-not $vsPath) {
            Write-Error "Visual Studio installation not found."
            exit 1
          }

          Write-Host "Visual Studio found at:"
          Write-Host $vsPath

          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"

          & $installer modify `
            --installPath "$vsPath" `
            --add Microsoft.VisualStudio.ProjectTemplates.Msi `
            --quiet `
            --norestart `
            --wait

      - name: Build Solution
        shell: powershell
        run: |
          msbuild ModbusTool.sln `
            /p:Configuration=Release `
            /p:Platform="Any CPU" `
            /m

      - name: Build Installer
        shell: powershell
        run: |
          msbuild Setup\ModbusTool\ModbusTool.vdproj `
            /p:Configuration=Release `
            /p:Platform="Any CPU"

      - name: List build output
        shell: powershell
        run: |
          Write-Host "===== MSI FILES ====="
          Get-ChildItem -Path . -Filter *.msi -Recurse | Select-Object FullName

          Write-Host "===== EXE FILES ====="
          Get-ChildItem -Path . -Filter *.exe -Recurse | Select-Object FullName

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: ModbusTool-Installer
          path: |
            **/*.msi
            **/setup.exe
