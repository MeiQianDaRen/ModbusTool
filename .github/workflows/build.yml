name: Build ModbusTool

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:

      # =========================
      # 1. 下载源码
      # =========================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # 2. 查找 Visual Studio
      # =========================
      - name: Locate Visual Studio
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          $vsPath = & $vswhere -latest -products * -property installationPath

          if (-not $vsPath) {
            Write-Error "Visual Studio installation not found."
            exit 1
          }

          Write-Host "Visual Studio:"
          Write-Host $vsPath

          echo "VS_PATH=$vsPath" >> $env:GITHUB_ENV

      # =========================
      # 3. 找到 MSBuild
      # =========================
      - name: Locate MSBuild
        shell: powershell
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest `
            -products * `
            -requires Microsoft.Component.MSBuild `
            -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1

          if (-not $msbuild) {
            Write-Error "MSBuild not found."
            exit 1
          }

          Write-Host "MSBuild:"
          Write-Host $msbuild

          echo "MSBUILD=$msbuild" >> $env:GITHUB_ENV

      # =========================
      # 4. 编译 C# 项目
      # =========================
      - name: Build Solution
        shell: powershell
        run: |
          & "$env:MSBUILD" `
            "$env:GITHUB_WORKSPACE\ModbusTool.sln" `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform="Any CPU" `
            /m

          if ($LASTEXITCODE -ne 0) {
            Write-Error "C# build failed."
            exit $LASTEXITCODE
          }

      # =========================
      # 5. 查看编译结果
      # =========================
      - name: Inspect Build Output
        shell: powershell
        run: |
          Write-Host "===== Release Directory ====="

          if (-not (Test-Path "$env:GITHUB_WORKSPACE\Release")) {
            Write-Error "Release directory not found."
            exit 1
          }

          Get-ChildItem `
            "$env:GITHUB_WORKSPACE\Release" `
            -Recurse |
            Select-Object FullName

      # =========================
      # 6. 安装 Inno Setup
      # =========================
      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup --yes --no-progress

      # =========================
      # 7. 编译安装包
      # =========================
      - name: Build Installer
        shell: powershell
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"

          if (-not (Test-Path $iscc)) {
            Write-Error "Inno Setup compiler not found."
            exit 1
          }

          $iss = "$env:GITHUB_WORKSPACE\installer\ModbusTool.iss"

          if (-not (Test-Path $iss)) {
            Write-Error "ModbusTool.iss not found."
            exit 1
          }

          Write-Host "Building installer:"
          Write-Host $iss

          & $iscc $iss

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup build failed."
            exit $LASTEXITCODE
          }

      # =========================
      # 8. 查找 EXE 安装包
      # =========================
      - name: Find Installer
        shell: powershell
        run: |
          Write-Host "===== Installer ====="

          $installer = Get-ChildItem `
            -Path "$env:GITHUB_WORKSPACE\installer" `
            -Filter "*.exe" `
            -Recurse `
            -ErrorAction SilentlyContinue

          if (-not $installer) {
            Write-Error "Installer EXE was not generated."
            exit 1
          }

          foreach ($file in $installer) {
            Write-Host $file.FullName
          }

      # =========================
      # 9. 上传安装包
      # =========================
      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: ModbusTool-Setup
          path: |
            installer/*.exe
